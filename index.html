<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdel Manitas - Servicios de Pintura, Jardinería y Reparaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {margin:0;padding:0;box-sizing:border-box;}

        :root {
            --primary-color:#2ecc71;
            --primary-dark:#27ae60;
            --dark-bg:#1a1a1a;
            --white:#fff;
        }

        body {
            font-family:'Poppins',sans-serif;
        }

        header {
            background:linear-gradient(135deg,#2ecc71,#27ae60);
            color:white;
            padding:100px 20px;
            text-align:center;
        }

        nav {
            position:sticky;
            top:0;
            background:white;
            display:flex;
            justify-content:center;
        }

        nav a {
            padding:15px;
            font-weight:600;
            text-decoration:none;
            color:black;
        }

        section {
            padding:60px 20px;
            max-width:1000px;
            margin:auto;
        }

        .contact-form {
            display:grid;
            gap:15px;
            max-width:500px;
            margin:auto;
        }

        input, textarea {
            padding:12px;
            border-radius:5px;
            border:none;
            background:#eee;
        }

        button {
            padding:12px;
            background:#2ecc71;
            color:white;
            border:none;
            cursor:pointer;
        }

        #mensaje-exito {
            display:none;
            text-align:center;
            margin-top:15px;
            color:#2ecc71;
            font-weight:bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🏠 Abdel Manitas</h1>
    <p>Transformamos tu espacio</p>
</header>

<nav>
    <a href="#contacto">Contacto</a>
</nav>

<section id="contacto">
    <h2>Contáctanos</h2>

    <form class="contact-form" action="https://formspree.io/f/xxxxxabc" method="POST">
        
        <input type="hidden" name="_subject" value="🔥 Nuevo cliente desde la web Abdel Manitas">
        <input type="text" name="_honey" style="display:none">

        <input type="text" name="nombre" placeholder="Tu Nombre" required>
        <input type="email" name="email" placeholder="Tu Email" required>
        <textarea name="mensaje" placeholder="Tu Mensaje" required></textarea>

        <button type="submit">Enviar Mensaje</button>
    </form>

    <p id="mensaje-exito">✅ ¡Mensaje enviado! Te responderemos pronto.</p>
</section>

<script>
const form = document.querySelector(".contact-form");
const mensaje = document.getElementById("mensaje-exito");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = new FormData(form);

    const response = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
        form.reset();
        mensaje.style.display = "block";
    } else {
        alert("Error al enviar");
    }
});
</script>

</body>
</html>
